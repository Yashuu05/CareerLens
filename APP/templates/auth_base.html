<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CareerLens - Authentication{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            position: relative;
            z-index: 1;
            overflow: hidden;
        }
        .auth-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-image: 
                radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.15) 0px, transparent 50%);
        }
        .auth-card {
            width: 100%;
            max-width: 450px;
            margin: 1rem;
            position: relative;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-header i {
            width: 48px;
            height: 48px;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }
        .error-message {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--danger-red);
            padding: 0.75rem;
            border-radius: var(--radius-sm);
            margin-bottom: 1rem;
            font-size: 0.875rem;
            text-align: center;
            border: 1px solid var(--danger-red);
        }
        /* Loader styles */
        .loader-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(5px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        [data-theme="dark"] .loader-overlay {
            background: rgba(18, 18, 18, 0.8);
        }
        .loader-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid var(--border-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Primary Loader -->
    <div id="primary-loader" class="loader-overlay">
        <div class="spinner"></div>
    </div>

    <div class="auth-container">
        <div class="auth-card glass-card">
            <div class="auth-header">
                <i data-feather="compass"></i>
                <h2 style="margin-bottom: 0.25rem;">CareerLens</h2>
                <p class="text-secondary" style="font-size: 0.95rem;">{% block subtitle %}{% endblock %}</p>
            </div>
            {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
            {% endif %}
            {% block content %}{% endblock %}
        </div>
    </div>

    <!-- Initialize Icons & Loader Logic -->
    <script>
      feather.replace();
      
      // Show loader on form submit
      document.addEventListener('submit', function(e) {
          document.getElementById('primary-loader').classList.add('active');
      });
      // Show loader on link clicks (except anchors or targets)
      document.addEventListener('click', function(e) {
          const link = e.target.closest('a');
          if (link && link.href && !link.href.startsWith('#') && !link.target) {
              document.getElementById('primary-loader').classList.add('active');
          }
      });
      
      // Password toggle
      function togglePassword(inputId, btn) {
          const input = document.getElementById(inputId);
          const icon = btn.querySelector('i');
          if (input.type === 'password') {
              input.type = 'text';
              icon.setAttribute('data-feather', 'eye-off');
          } else {
              input.type = 'password';
              icon.setAttribute('data-feather', 'eye');
          }
          feather.replace();
      }
    </script>
</body>
</html>
